<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARLO STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo';
background:#05070a;
color:white;
}

header{
text-align:center;
padding:15px;
border-bottom:2px solid #00d2ff;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00d2ff;
}

.nav{
display:flex;
justify-content:center;
gap:10px;
padding:10px;
background:#111;
position:sticky;
top:0;
}

.nav button{
padding:10px;
border:none;
border-radius:10px;
background:#222;
color:#ccc;
cursor:pointer;
}

.nav button.active{
background:#00d2ff;
color:black;
}

.section{display:none;padding:15px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
}

.card{
background:#111;
padding:10px;
border-radius:10px;
text-align:center;
}

.price{
color:#00d2ff;
font-weight:bold;
margin:5px 0;
}

button.buy{
width:100%;
padding:8px;
border:none;
border-radius:8px;
background:linear-gradient(45deg,#00d2ff,#9d50bb);
color:white;
cursor:pointer;
}

img{
width:100%;
border-radius:10px;
margin-bottom:8px;
}

/* 🔥 زر الأدمن الأخضر */
.admin-btn{
position:fixed;
top:10px;
left:10px;
background:#25d366;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 10px rgba(37,211,102,0.4);
transition:0.3s;
}

.admin-btn:hover{
transform:scale(1.05);
}

#admin{
display:none;
background:#111;
margin:15px;
padding:15px;
border-radius:10px;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

/* 🛡️ منع التحديد */
*{
user-select:none;
}

</style>
</head>

<body>

<header>
<div class="logo">KARLO STORE 🔥</div>
</header>

<div class="nav">
<button class="active" onclick="show('games')">الشحن</button>
<button onclick="show('accounts')">الحسابات</button>
</div>

<!-- 🎮 الشحن -->
<div id="games" class="section active">
<h3>🎮 فري فاير</h3>

<div class="grid">
<div class="card">
<h4>110💎</h4>
<div class="price">12.5 د.ل</div>
<button class="buy" onclick="order('FF','110💎','12.5')">طلب</button>
</div>
</div>
</div>

<!-- 👤 الحسابات -->
<div id="accounts" class="section">
<h3>👤 الحسابات</h3>
<div class="grid" id="accBox"></div>
</div>

<!-- 🔐 لوحة التحكم -->
<div id="admin">
<h3>لوحة التحكم 🔐</h3>

<input id="name" placeholder="اسم الحساب">
<input id="price" placeholder="السعر">
<input type="file" id="img" accept="image/*">

<button class="buy" onclick="addAccount()">إضافة حساب</button>
</div>

<!-- 🔥 زر الأدمن -->
<button class="admin-btn" onclick="openAdmin()">🔐 Admin</button>

<script>

let accounts = JSON.parse(localStorage.getItem("acc")) || [];

/* 🚫 منع الكليك يمين */
document.addEventListener('contextmenu', function(e){
e.preventDefault();
alert("❌ غير مسموح");
});

/* 🚫 منع اختصارات */
document.addEventListener('keydown', function(e){

if(e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i')){
e.preventDefault();
alert("❌ محظور");
}

});

/* تنقل */
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* طلب واتساب */
function order(game,item,price){
let id = prompt("أدخل ID:");
if(id){
window.location.href =
`https://wa.me/218934551020?text=${game} ${item} بـ ${price} د.ل ID:${id}`;
}
}

/* كلمة السر */
const PASS = "K@RLO-STORE-2026-ULTRA99";

/* فتح الأدمن */
function openAdmin(){
let p = prompt("🔐 كلمة السر:");
if(p === PASS){
document.getElementById("admin").style.display="block";
alert("تم الدخول 🔥");
}else{
alert("خطأ ❌");
}
}

/* إضافة حساب + صورة */
function addAccount(){

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let file = document.getElementById("img").files[0];

if(!name || !price || !file){
return alert("❌ املأ كل البيانات");
}

let reader = new FileReader();

reader.onload = function(){

accounts.push({
name,
price,
img:reader.result
});

localStorage.setItem("acc",JSON.stringify(accounts));
render();

alert("✅ تم إضافة الحساب");
}

reader.readAsDataURL(file);
}

/* عرض الحسابات */
function render(){

let box = document.getElementById("accBox");
box.innerHTML="";

accounts.forEach(a=>{
box.innerHTML += `
<div class="card">
<img src="${a.img}">
<h4>${a.name}</h4>
<div class="price">${a.price} د.ل</div>
<button class="buy">شراء</button>
</div>
`;
});

}

render();

</script>

</body>
</html>
